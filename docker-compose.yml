services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: app
    container_name: erp_app
    restart: unless-stopped
    environment:
      APP_NAME: "${ERP_APP_NAME:-ERP}"
      APP_KEY: "${ERP_APP_KEY:-}"
      APP_ENV: "${ERP_APP_ENV:-local}"
      APP_DEBUG: "${ERP_APP_DEBUG:-true}"
      APP_URL: "${ERP_APP_URL:-http://localhost:8083}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${ERP_DB_DATABASE:-erp_app}"
      DB_USERNAME: "${ERP_DB_USERNAME:-erp_user}"
      DB_PASSWORD: "${ERP_DB_PASSWORD:-erp_password}"
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: file
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./laravel/app:/var/www/html/app
      - ./laravel/bootstrap:/var/www/html/bootstrap
      - ./laravel/config:/var/www/html/config
      - ./laravel/database:/var/www/html/database
      - ./laravel/public:/var/www/html/public
      - ./laravel/resources:/var/www/html/resources
      - ./laravel/routes:/var/www/html/routes
      - app_storage:/var/www/html/storage

  nginx:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: nginx
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "${ERP_APP_PORT:-8083}:80"
    depends_on:
      - app
    volumes:
      - ./laravel/public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro

  vite:
    image: node:22-bookworm-slim
    container_name: erp_vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_HMR_HOST: "${ERP_VITE_HMR_HOST:-localhost}"
      VITE_PORT: "${ERP_VITE_PORT:-5173}"
      VITE_USE_POLLING: "${ERP_VITE_USE_POLLING:-true}"
    ports:
      - "${ERP_VITE_PORT:-5173}:5173"
    volumes:
      - ./laravel:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: erp_mysql
    restart: unless-stopped
    ports:
      - "${ERP_MYSQL_PORT:-3309}:3306"
    environment:
      MYSQL_DATABASE: "${ERP_DB_DATABASE:-erp_app}"
      MYSQL_USER: "${ERP_DB_USERNAME:-erp_user}"
      MYSQL_PASSWORD: "${ERP_DB_PASSWORD:-erp_password}"
      MYSQL_ROOT_PASSWORD: "${ERP_MYSQL_ROOT_PASSWORD:-erp_root_password}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  app_storage:
  mysql_data:
  vite_node_modules:
